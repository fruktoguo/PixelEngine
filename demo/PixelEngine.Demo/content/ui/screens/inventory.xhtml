<rml title="法杖与法术" data-screen="inventory" data-contract="demo.webfirst.inventory/v3" style="left: 0px; top: 0px; width: 1280px; height: 720px; background-color: rgba(0, 0, 0, 0)">
  <head>
    <style>
      rml, body { margin: 0px; font-family: "Noto Sans SC"; color: #fff8ee; background-color: rgba(0, 0, 0, 0); }
      #inventory_scrim { position: absolute; left: 0px; top: 0px; width: 1280px; height: 720px; background-color: rgba(20, 12, 18, 168); }
      #inventory_title { position: absolute; left: 24px; top: 16px; margin: 0px; color: #ffffff; font-size: 19px; }
      #inventory_subtitle { position: absolute; left: 24px; top: 43px; margin: 0px; color: #dac9c0; font-size: 12px; }
      #wand_spell_panel { position: absolute; left: 24px; top: 78px; width: 352px; height: 442px; background-color: rgba(73, 48, 47, 239); border-width: 3px; border-color: #9f6658; }
      #item_stats_panel { position: absolute; left: 390px; top: 78px; width: 352px; height: 442px; background-color: rgba(73, 48, 47, 239); border-width: 3px; border-color: #9f6658; }
      #wand_panel_label { position: absolute; left: 36px; top: 88px; color: #ffe6b2; font-size: 12px; }
      #item_panel_label { position: absolute; left: 402px; top: 88px; color: #ffe6b2; font-size: 12px; }
      button { color: #fff8ed; background-color: rgba(83, 55, 52, 242); border-width: 2px; border-color: #a86458; }
      button:hover { color: #ffffff; background-color: rgba(132, 79, 61, 248); border-color: #f4cf64; }
      .wand_button { position: absolute; top: 112px; width: 76px; height: 72px; padding-top: 37px; font-size: 10px; line-height: 13px; text-align: center; }
      #inventory_wand_1 { left: 36px; }
      #inventory_wand_2 { left: 120px; }
      #inventory_wand_3 { left: 204px; }
      #inventory_wand_4 { left: 288px; }
      .inventory_wand_icon { position: absolute; top: 125px; width: 42px; height: 27px; pointer-events: none; }
      #inventory_wand_icon_1 { left: 53px; }
      #inventory_wand_icon_2 { left: 137px; }
      #inventory_wand_icon_3 { left: 221px; }
      #inventory_wand_icon_4 { left: 305px; }
      .spell_slot { position: absolute; width: 76px; height: 70px; padding: 7px; color: #fff3eb; font-size: 11px; line-height: 14px; text-align: left; background-color: rgba(81, 53, 50, 244); border-style: dashed; border-width: 2px; border-color: #b76459; }
      #inventory_slot_1 { left: 36px; top: 194px; }
      #inventory_slot_2 { left: 120px; top: 194px; }
      #inventory_slot_3 { left: 204px; top: 194px; }
      #inventory_slot_4 { left: 288px; top: 194px; }
      #inventory_slot_5 { left: 36px; top: 272px; }
      #inventory_slot_6 { left: 120px; top: 272px; }
      #inventory_slot_7 { left: 204px; top: 272px; }
      #inventory_slot_8 { left: 288px; top: 272px; }
      #inventory_slot_9 { left: 36px; top: 350px; }
      #inventory_slot_10 { left: 120px; top: 350px; }
      #inventory_slot_11 { left: 204px; top: 350px; }
      #inventory_slot_12 { left: 288px; top: 350px; }
      #inventory_slot_13 { left: 36px; top: 428px; }
      #inventory_slot_14 { left: 120px; top: 428px; }
      #inventory_slot_15 { left: 204px; top: 428px; }
      #inventory_slot_16 { left: 288px; top: 428px; }
      .item_slot { position: absolute; top: 112px; width: 76px; height: 72px; color: #b89188; font-size: 18px; line-height: 72px; text-align: center; background-color: rgba(81, 53, 50, 230); border-style: dashed; border-width: 2px; border-color: #a65d54; }
      #inventory_item_1 { left: 402px; }
      #inventory_item_2 { left: 486px; }
      #inventory_item_3 { left: 570px; }
      #inventory_item_4 { left: 654px; }
      #inventory_selected { position: absolute; left: 402px; top: 202px; width: 326px; margin: 0px; color: #ffffff; font-size: 18px; }
      #inventory_edit_state { position: absolute; left: 402px; top: 231px; width: 326px; margin: 0px; color: #f0c663; font-size: 11px; }
      #inventory_stats { display: none; }
      .stat_icon { position: absolute; left: 406px; width: 20px; height: 20px; pointer-events: none; }
      .stat_label { position: absolute; left: 435px; width: 130px; color: #cdbbb3; font-size: 11px; }
      .stat_value { position: absolute; left: 570px; width: 154px; color: #ffffff; font-size: 12px; text-align: right; }
      #stat_icon_shuffle { top: 266px; }
      #stat_icon_draw { top: 298px; }
      #stat_icon_capacity { top: 330px; }
      #stat_icon_cast { top: 362px; }
      #stat_icon_recharge { top: 394px; }
      #stat_icon_mana_max { top: 426px; }
      #stat_icon_mana_charge { top: 458px; }
      #stat_icon_spread { top: 490px; }
      #stat_label_shuffle, #stat_value_shuffle { top: 268px; }
      #stat_label_draw, #stat_value_draw { top: 300px; }
      #stat_label_capacity, #stat_value_capacity { top: 332px; }
      #stat_label_cast, #stat_value_cast { top: 364px; }
      #stat_label_recharge, #stat_value_recharge { top: 396px; }
      #stat_label_mana_max, #stat_value_mana_max { top: 428px; }
      #stat_label_mana_charge, #stat_value_mana_charge { top: 460px; }
      #stat_label_spread, #stat_value_spread { top: 492px; }
      #inventory_back { position: absolute; left: 24px; top: 542px; width: 118px; height: 38px; color: #ffffff; background-color: rgba(89, 57, 51, 245); border-color: #c27a5f; }
      #inventory_back:hover { background-color: rgba(140, 83, 60, 250); border-color: #f1cb65; }
    </style>
  </head>
  <body>
    <div id="inventory_scrim"></div>
    <p id="inventory_title">法杖与法术 / Wands &amp; Spells</p>
    <p id="inventory_subtitle">选择法杖，查看参数并调整法术顺序</p>
    <div id="wand_spell_panel"></div>
    <div id="item_stats_panel"></div>
    <span id="wand_panel_label">法杖与法术</span>
    <span id="item_panel_label">物品与法杖参数</span>
    <button id="inventory_wand_1" class="wand_button" data-event-click="select_wand_1"><span path="inventory.wand_1">● 1 Apprentice Wand</span></button>
    <button id="inventory_wand_2" class="wand_button" data-event-click="select_wand_2"><span path="inventory.wand_2">2 Trigger Wand</span></button>
    <button id="inventory_wand_3" class="wand_button" data-event-click="select_wand_3"><span path="inventory.wand_3">3 Chaos Wand</span></button>
    <button id="inventory_wand_4" class="wand_button" data-event-click="select_wand_4"><span path="inventory.wand_4">4 Geomancer Wand</span></button>
    <img id="inventory_wand_icon_1" class="inventory_wand_icon" src="../images/noita/wands/apprentice.png" width="42" height="27" alt="Apprentice Wand" />
    <img id="inventory_wand_icon_2" class="inventory_wand_icon" src="../images/noita/wands/trigger.png" width="42" height="27" alt="Trigger Wand" />
    <img id="inventory_wand_icon_3" class="inventory_wand_icon" src="../images/noita/wands/chaos.png" width="42" height="27" alt="Chaos Wand" />
    <img id="inventory_wand_icon_4" class="inventory_wand_icon" src="../images/noita/wands/geomancer.png" width="42" height="27" alt="Geomancer Wand" />
    <button id="inventory_slot_1" class="spell_slot" data-event-click="cycle_spell_1"><span path="inventory.slot_1">01 Mana Coil</span></button>
    <button id="inventory_slot_2" class="spell_slot" data-event-click="cycle_spell_2"><span path="inventory.slot_2">02 Damage Rune</span></button>
    <button id="inventory_slot_3" class="spell_slot" data-event-click="cycle_spell_3"><span path="inventory.slot_3">03 Ember Bolt</span></button>
    <button id="inventory_slot_4" class="spell_slot" data-event-click="cycle_spell_4"><span path="inventory.slot_4">04 Twin Weave</span></button>
    <button id="inventory_slot_5" class="spell_slot" data-event-click="cycle_spell_5"><span path="inventory.slot_5">05 Stone Orb</span></button>
    <button id="inventory_slot_6" class="spell_slot" data-event-click="cycle_spell_6"><span path="inventory.slot_6">06 Precision Rune</span></button>
    <button id="inventory_slot_7" class="spell_slot" data-event-click="cycle_spell_7"><span path="inventory.slot_7">07 Echo Rune</span></button>
    <button id="inventory_slot_8" class="spell_slot" data-event-click="cycle_spell_8"><span path="inventory.slot_8">08 --</span></button>
    <button id="inventory_slot_9" class="spell_slot" data-event-click="cycle_spell_9"><span path="inventory.slot_9">09 --</span></button>
    <button id="inventory_slot_10" class="spell_slot" data-event-click="cycle_spell_10"><span path="inventory.slot_10">10 --</span></button>
    <button id="inventory_slot_11" class="spell_slot" data-event-click="cycle_spell_11"><span path="inventory.slot_11">11 --</span></button>
    <button id="inventory_slot_12" class="spell_slot" data-event-click="cycle_spell_12"><span path="inventory.slot_12">12 --</span></button>
    <button id="inventory_slot_13" class="spell_slot" data-event-click="cycle_spell_13"><span path="inventory.slot_13">13 --</span></button>
    <button id="inventory_slot_14" class="spell_slot" data-event-click="cycle_spell_14"><span path="inventory.slot_14">14 --</span></button>
    <button id="inventory_slot_15" class="spell_slot" data-event-click="cycle_spell_15"><span path="inventory.slot_15">15 --</span></button>
    <button id="inventory_slot_16" class="spell_slot" data-event-click="cycle_spell_16"><span path="inventory.slot_16">16 --</span></button>
    <div id="inventory_item_1" class="item_slot">—</div>
    <div id="inventory_item_2" class="item_slot">—</div>
    <div id="inventory_item_3" class="item_slot">—</div>
    <div id="inventory_item_4" class="item_slot">—</div>
    <p id="inventory_selected" path="inventory.selected_name">Apprentice Wand</p>
    <p id="inventory_stats" path="inventory.stats">Ordered Draw 1 Mana 220</p>
    <p id="inventory_edit_state" path="inventory.edit_state">可编辑：点击槽位循环法术</p>
    <img id="stat_icon_shuffle" class="stat_icon" src="../images/noita/inventory/icon_gun_shuffle.png" width="20" height="20" alt="Shuffle" />
    <img id="stat_icon_draw" class="stat_icon" src="../images/noita/inventory/icon_gun_actions_per_round.png" width="20" height="20" alt="Spells per cast" />
    <img id="stat_icon_capacity" class="stat_icon" src="../images/noita/inventory/icon_gun_capacity.png" width="20" height="20" alt="Capacity" />
    <img id="stat_icon_cast" class="stat_icon" src="../images/noita/hud/reload.png" width="20" height="20" alt="Cast delay" />
    <img id="stat_icon_recharge" class="stat_icon" src="../images/noita/inventory/icon_gun_reload_time.png" width="20" height="20" alt="Recharge" />
    <img id="stat_icon_mana_max" class="stat_icon" src="../images/noita/inventory/icon_mana_max.png" width="20" height="20" alt="Mana max" />
    <img id="stat_icon_mana_charge" class="stat_icon" src="../images/noita/inventory/icon_mana_charge_speed.png" width="20" height="20" alt="Mana charge" />
    <img id="stat_icon_spread" class="stat_icon" src="../images/noita/inventory/icon_spread_degrees.png" width="20" height="20" alt="Spread" />
    <span id="stat_label_shuffle" class="stat_label">施放顺序</span><span id="stat_value_shuffle" class="stat_value" path="inventory.shuffle_text">按序</span>
    <span id="stat_label_draw" class="stat_label">每次施放</span><span id="stat_value_draw" class="stat_value" path="inventory.draw_text">每次 1</span>
    <span id="stat_label_capacity" class="stat_label">法术容量</span><span id="stat_value_capacity" class="stat_value" path="inventory.capacity_text">容量 8</span>
    <span id="stat_label_cast" class="stat_label">施放延迟</span><span id="stat_value_cast" class="stat_value" path="inventory.cast_delay_text">0.12s</span>
    <span id="stat_label_recharge" class="stat_label">充能时间</span><span id="stat_value_recharge" class="stat_value" path="inventory.recharge_text">0.35s</span>
    <span id="stat_label_mana_max" class="stat_label">最大法力</span><span id="stat_value_mana_max" class="stat_value" path="inventory.mana_max_text">220</span>
    <span id="stat_label_mana_charge" class="stat_label">法力恢复</span><span id="stat_value_mana_charge" class="stat_value" path="inventory.mana_charge_text">55/s</span>
    <span id="stat_label_spread" class="stat_label">散布</span><span id="stat_value_spread" class="stat_value" path="inventory.spread_text">0°</span>
    <button id="inventory_back" data-event-click="back_main">关闭</button>
  </body>
</rml>
