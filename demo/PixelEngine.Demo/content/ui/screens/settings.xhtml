<rml title="设置" data-screen="settings" data-contract="demo.webfirst.settings/v2" style="left: 0px; top: 0px; width: 1280px; height: 720px; background-color: rgba(0, 0, 0, 0)">
  <head>
    <style>
      rml, body { margin: 0px; font-family: "Noto Sans SC"; color: #fff8ee; background-color: rgba(0, 0, 0, 0); }
      #settings_scrim { position: absolute; left: 0px; top: 0px; width: 1280px; height: 720px; background-color: rgba(10, 6, 11, 176); }
      #settings_panel { position: absolute; left: 402px; top: 142px; width: 476px; height: 400px; background-color: rgba(69, 45, 44, 247); border-width: 3px; border-color: #a26958; }
      #settings_title { position: absolute; left: 426px; top: 166px; width: 428px; margin: 0px; color: #ffffff; font-size: 22px; }
      #settings_audio_hint { position: absolute; left: 426px; top: 215px; width: 428px; color: #d5c2b9; font-size: 12px; }
      #settings_vsync_hint { position: absolute; left: 426px; top: 307px; width: 428px; color: #d5c2b9; font-size: 12px; }
      #settings_audio { position: absolute; left: 426px; top: 244px; width: 404px; height: 38px; font-size: 14px; }
      #settings_vsync { position: absolute; left: 426px; top: 336px; width: 404px; height: 38px; font-size: 14px; }
      #settings_back { position: absolute; left: 426px; top: 456px; width: 160px; height: 42px; color: #ffffff; background-color: #765044; border-width: 2px; border-color: #bd7b60; }
      #settings_back:hover { background-color: #995f47; border-color: #f0c867; }
    </style>
  </head>
  <body>
    <div id="settings_scrim"></div>
    <div id="settings_panel"></div>
    <p id="settings_title">设置</p>
    <p id="settings_audio_hint">游戏音效与环境音</p>
    <checkbox id="settings_audio" path="settings.audio" text="音频" checked="true" data-event-change="toggle_audio" />
    <p id="settings_vsync_hint">画面同步</p>
    <checkbox id="settings_vsync" path="settings.vsync" text="垂直同步" checked="true" data-event-change="toggle_vsync" />
    <button id="settings_back" data-event-click="back_main">返回</button>
  </body>
</rml>
