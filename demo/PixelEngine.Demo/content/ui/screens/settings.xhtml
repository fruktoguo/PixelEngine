<rml title="设置" data-screen="settings" data-contract="demo.webfirst.settings/v2" style="left: 0px; top: 0px; width: 2560px; height: 1440px; background-color: rgba(0, 0, 0, 0)">
  <head>
    <style>
      rml, body { margin: 0px; font-family: "Noto Sans SC"; color: #fff8ee; background-color: rgba(0, 0, 0, 0); }
      #settings_scrim { position: absolute; left: 0px; top: 0px; width: 2560px; height: 1440px; background-color: rgba(10, 6, 11, 176); }
      #settings_panel { position: absolute; left: 760px; top: 180px; width: 1040px; height: 1080px; background-color: rgba(69, 45, 44, 247); border-width: 6px; border-color: #a26958; }
      #settings_title { position: absolute; left: 824px; top: 236px; width: 912px; margin: 0px; color: #ffffff; font-size: 44px; }
      #settings_audio_hint { position: absolute; left: 824px; top: 334px; width: 912px; color: #d5c2b9; font-size: 24px; }
      #settings_vsync_hint { position: absolute; left: 824px; top: 518px; width: 912px; color: #d5c2b9; font-size: 24px; }
      #settings_resolution_hint { position: absolute; left: 824px; top: 702px; width: 912px; color: #d5c2b9; font-size: 24px; }
      #settings_resolution_value { position: absolute; left: 824px; top: 754px; width: 912px; color: #ffffff; font-size: 30px; }
      #settings_resolution_note { position: absolute; left: 824px; top: 814px; width: 912px; color: #c7ada3; font-size: 20px; }
      #settings_audio { position: absolute; left: 824px; top: 392px; width: 864px; height: 76px; font-size: 28px; }
      #settings_vsync { position: absolute; left: 824px; top: 576px; width: 864px; height: 76px; font-size: 28px; }
      #resolution_720p { position: absolute; left: 824px; top: 882px; width: 260px; height: 76px; }
      #resolution_1080p { position: absolute; left: 1112px; top: 882px; width: 260px; height: 76px; }
      #resolution_1440p { position: absolute; left: 1400px; top: 882px; width: 288px; height: 76px; }
      #settings_back { position: absolute; left: 824px; top: 1082px; width: 320px; height: 84px; color: #ffffff; background-color: #765044; border-width: 4px; border-color: #bd7b60; }
      #resolution_720p, #resolution_1080p, #resolution_1440p { color: #ffffff; background-color: #5f403b; border-width: 4px; border-color: #936353; }
      #resolution_720p:hover, #resolution_1080p:hover, #resolution_1440p:hover { background-color: #995f47; border-color: #f0c867; }
      #settings_back:hover { background-color: #995f47; border-color: #f0c867; }
    </style>
  </head>
  <body>
    <div id="settings_scrim"></div>
    <div id="settings_panel"></div>
    <p id="settings_title">设置</p>
    <p id="settings_audio_hint">游戏音效与环境音</p>
    <checkbox id="settings_audio" path="settings.audio" text="音频" checked="true" data-event-change="toggle_audio" />
    <p id="settings_vsync_hint">画面同步</p>
    <checkbox id="settings_vsync" path="settings.vsync" text="垂直同步" checked="true" data-event-change="toggle_vsync" />
    <p id="settings_resolution_hint">显示分辨率</p>
    <p id="settings_resolution_value" data-model="settings.resolution">由宿主控制</p>
    <p id="settings_resolution_note">只调整窗口和 UI 清晰度，不改变世界格、角色、碰撞或相机逻辑视野。</p>
    <button id="resolution_720p" data-event-click="resolution_720p">1280 x 720</button>
    <button id="resolution_1080p" data-event-click="resolution_1080p">1920 x 1080</button>
    <button id="resolution_1440p" data-event-click="resolution_1440p">2560 x 1440</button>
    <button id="settings_back" data-event-click="back_main">返回</button>
  </body>
</rml>
