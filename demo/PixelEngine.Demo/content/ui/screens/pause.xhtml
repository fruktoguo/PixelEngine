<rml title="暂停" data-screen="pause" data-contract="demo.webfirst.pause/v2" style="left: 0px; top: 0px; width: 2560px; height: 1440px; background-color: rgba(0, 0, 0, 0)">
  <head>
    <style>
      rml, body { margin: 0px; font-family: "Noto Sans SC"; color: #ffffff; background-color: rgba(0, 0, 0, 0); }
      #pause_scrim { position: absolute; left: 0px; top: 0px; width: 2560px; height: 1440px; background-color: rgba(9, 5, 11, 185); }
      #pause_logo { position: absolute; left: 1014px; top: 156px; width: 532px; height: 308px; }
      #pause_panel { position: absolute; left: 940px; top: 500px; width: 680px; height: 688px; }
      #pause_title { position: absolute; left: 940px; top: 492px; width: 680px; color: #fff5e5; font-size: 40px; text-align: center; }
      #pause_hint { position: absolute; left: 940px; top: 556px; width: 680px; color: #c9b8af; font-size: 22px; text-align: center; }
      button { position: absolute; left: 980px; width: 600px; height: 84px; color: #fff8ed; background-color: rgba(72, 46, 45, 245); border-width: 4px; border-color: #9f6556; }
      button:hover { color: #ffffff; background-color: rgba(129, 75, 56, 250); border-color: #f1ca62; }
      #pause_resume { top: 632px; }
      #pause_settings { top: 732px; }
      #pause_restart { top: 832px; }
      #pause_quit { top: 932px; }
    </style>
  </head>
  <body>
    <div id="pause_scrim"></div>
    <img id="pause_logo" src="../images/noita/menu/noita_logo.png" width="266" height="154" alt="Noita" />
    <div id="pause_panel"></div>
    <p id="pause_title">游戏暂停</p>
    <p id="pause_hint">世界模拟已停止</p>
    <button id="pause_resume" data-event-click="resume_game">继续</button>
    <button id="pause_settings" data-event-click="open_settings">设置</button>
    <button id="pause_restart" data-event-click="restart_game">重新开始</button>
    <button id="pause_quit" data-event-click="quit_game">退出游戏</button>
  </body>
</rml>
