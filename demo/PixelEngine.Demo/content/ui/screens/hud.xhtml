<rml title="HUD" data-screen="hud" data-contract="demo.webfirst.hud/v9" style="left: 0px; top: 16px; width: 2560px; height: 148px; background-color: rgba(0, 0, 0, 0)">
  <head>
    <style>
      rml, body { margin: 0px; font-family: "Noto Sans SC"; color: #ffffff; background-color: rgba(0, 0, 0, 0); }
      button { color: #f6e9dc; background-color: rgba(50, 38, 39, 210); border-width: 4px; border-color: #75504b; }
      button:hover { color: #ffffff; background-color: rgba(91, 58, 50, 232); border-color: #dfb453; }
      .quick_slot { position: absolute; top: 12px; width: 92px; height: 92px; padding-top: 54px; font-size: 20px; text-align: center; }
      #hud_wand_1 { left: 24px; }
      #hud_wand_2 { left: 124px; }
      #hud_wand_3 { left: 224px; }
      #hud_wand_4 { left: 324px; }
      .wand_icon { position: absolute; top: 28px; width: 60px; height: 40px; pointer-events: none; }
      #hud_wand_icon_1 { left: 40px; }
      #hud_wand_icon_2 { left: 140px; }
      #hud_wand_icon_3 { left: 240px; }
      #hud_wand_icon_4 { left: 340px; }
      .item_slot { position: absolute; top: 12px; width: 84px; height: 84px; color: #6f5452; text-align: center; line-height: 84px; background-color: rgba(46, 34, 36, 178); border-width: 4px; border-color: #674844; }
      #hud_item_1 { left: 436px; }
      #hud_item_2 { left: 528px; }
      #hud_item_3 { left: 620px; }
      #hud_item_4 { left: 712px; }
      #status_panel { position: absolute; left: 2060px; top: 12px; width: 476px; height: 124px; background-color: rgba(7, 5, 8, 128); border-width: 2px; border-color: rgba(111, 79, 67, 180); }
      .status_icon { position: absolute; left: 2076px; width: 28px; height: 28px; pointer-events: none; }
      #hud_health_icon { top: 22px; }
      #hud_levitation_icon { top: 50px; }
      #hud_mana_icon { top: 78px; }
      #hud_reload_icon { top: 106px; }
      progress { position: absolute; left: 2116px; width: 396px; height: 14px; margin: 0px; background-color: #211719; border-width: 2px; border-color: #684943; }
      #hud_health { top: 28px; }
      #hud_levitation { top: 56px; }
      #hud_ammo { top: 84px; }
      #hud_reload { top: 112px; }
      #hud_inventory, #hud_pause, #hud_telemetry, #hud_hidden_models { display: none; }
    </style>
  </head>
  <body>
    <button id="hud_wand_1" class="quick_slot" data-event-click="select_wand_1"><span path="hud.wand_1">● 1</span></button>
    <button id="hud_wand_2" class="quick_slot" data-event-click="select_wand_2"><span path="hud.wand_2">2</span></button>
    <button id="hud_wand_3" class="quick_slot" data-event-click="select_wand_3"><span path="hud.wand_3">3</span></button>
    <button id="hud_wand_4" class="quick_slot" data-event-click="select_wand_4"><span path="hud.wand_4">4</span></button>
    <img id="hud_wand_icon_1" class="wand_icon" src="../images/noita/wands/apprentice.png" width="30" height="20" alt="Apprentice Wand" />
    <img id="hud_wand_icon_2" class="wand_icon" src="../images/noita/wands/trigger.png" width="30" height="20" alt="Trigger Wand" />
    <img id="hud_wand_icon_3" class="wand_icon" src="../images/noita/wands/chaos.png" width="30" height="20" alt="Chaos Wand" />
    <img id="hud_wand_icon_4" class="wand_icon" src="../images/noita/wands/geomancer.png" width="30" height="20" alt="Geomancer Wand" />
    <div id="hud_item_1" class="item_slot">—</div>
    <div id="hud_item_2" class="item_slot">—</div>
    <div id="hud_item_3" class="item_slot">—</div>
    <div id="hud_item_4" class="item_slot">—</div>
    <div id="status_panel"></div>
    <img id="hud_health_icon" class="status_icon" src="../images/noita/hud/health.png" width="18" height="18" alt="Health" />
    <img id="hud_levitation_icon" class="status_icon" src="../images/noita/hud/jetpack.png" width="18" height="18" alt="Levitation" />
    <img id="hud_mana_icon" class="status_icon" src="../images/noita/hud/mana.png" width="18" height="18" alt="Mana" />
    <img id="hud_reload_icon" class="status_icon" src="../images/noita/hud/reload.png" width="18" height="18" alt="Recharge" />
    <progress id="hud_health" path="hud.health" value="1.0" text="生命"></progress>
    <progress id="hud_levitation" path="hud.levitation" value="1.0" text="悬浮"></progress>
    <progress id="hud_ammo" path="hud.ammo" value="0.0" text="Mana"></progress>
    <progress id="hud_reload" path="hud.reload" value="0.0" text="Recharge"></progress>
    <button id="hud_inventory" data-event-click="open_inventory">法术</button>
    <button id="hud_pause" data-event-click="pause_game">Ⅱ</button>
    <button id="hud_telemetry" data-event-click="toggle_telemetry">FPS</button>
    <div id="hud_hidden_models">
      <span id="hud_title" path="hud.mode_text">战役 / Campaign</span>
      <span id="hud_route" path="hud.run_state_text">探索 / Exploring</span>
      <span id="hud_region" path="hud.region_text">Mines</span>
      <span id="hud_seed_label">Seed</span>
      <span id="hud_seed" path="hud.seed_text">0000000000000000</span>
      <span id="hud_depth_label">深度 cell</span>
      <span id="hud_depth_value" path="hud.depth_cells">0</span>
      <progress id="hud_cooldown" path="hud.cooldown" value="1.0" text="Cast"></progress>
      <progress id="hud_heat" path="hud.heat" value="0.0" text="Projectiles"></progress>
      <span id="hud_equipment" path="hud.equipment_text">Apprentice Wand</span>
      <span id="hud_input_mode" path="hud.input_mode_text">战斗 / Combat</span>
      <span id="hud_material_name" path="hud.material_name">空气 / Air</span>
      <span id="hud_material_detail" path="hud.material_detail">可穿行的空区域</span>
      <progress path="hud.crystals" value="0.0"></progress>
      <progress path="hud.time" value="0.0"></progress>
      <progress path="hud.hazard" value="0.0"></progress>
      <progress path="hud.score" value="0.0"></progress>
      <progress path="hud.elevation" value="0.0"></progress>
      <progress id="hud_distance" path="hud.distance" value="0.0"></progress>
      <progress id="hud_depth" path="hud.depth" value="0.0"></progress>
      <progress id="hud_longitude" path="hud.longitude" value="0.5"></progress>
    </div>
  </body>
</rml>
